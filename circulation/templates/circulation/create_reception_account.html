{% extends 'circulation/base.html' %}
{% block title %}Create Reception Account{% endblock %}
{% block content %}
<a href="{% url 'manager_dashboard' %}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to Dashboard</a>
<h1 class="h4 mb-3">Create Reception Account</h1>
<div class="card p-4" style="max-width:520px;">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Create Account</button>
    </form>
</div>
{% endblock %}
