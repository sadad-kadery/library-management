{% extends 'circulation/base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<a href="{% if user.groups.all.0.name == 'Manager' %}{% url 'manager_dashboard' %}{% else %}{% url 'reception_dashboard' %}{% endif %}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to Dashboard</a>
<h1 class="h4 mb-3">Change Password</h1>
<div class="card p-4" style="max-width:520px;">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-sm">Change Password</button>
    </form>
</div>
{% endblock %}
