{% extends 'circulation/base.html' %}
{% block title %}Borrowers{% endblock %}
{% block content %}
    <a href="{% url 'reception_dashboard' %}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to Dashboard</a>
    <h1 class="h4 mb-3">Borrowers</h1>
    <a href="{% url 'borrower_add' %}" class="btn btn-primary btn-sm mb-3">Add Borrower</a>
    <table class="table table-striped">
        <tr><th>Name</th><th>Email</th><th>Phone</th><th></th></tr>
        {% for b in borrowers %}
        <tr>
            <td>{{ b.name }}</td><td>{{ b.email }}</td><td>{{ b.phone }}</td>
            <td>
                <a href="{% url 'borrower_edit' b.pk %}" class="btn btn-outline-secondary btn-sm">Edit</a>
                <a href="{% url 'borrower_delete' b.pk %}" class="btn btn-outline-danger btn-sm">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
