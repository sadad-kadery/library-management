{% extends 'circulation/base.html' %}
{% block title %}Manager Login{% endblock %}
{% block content %}
<div style="max-width:400px;">
    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to Catalog</a>
    <h1 class="h4 mb-3">Manager Login</h1>
    {% for message in messages %}
    <div class="alert alert-danger">{{ message }}</div>
    {% endfor %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
{% endblock %}
